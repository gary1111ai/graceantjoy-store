<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff5f7"><title>Graceantjoy · 手机壳图片图库</title>
<style>
:root{--pink:#fff5f7;--blush:#fbe8ee;--dark:#9d526d;--ink:#30272b;--muted:#897980;--line:#eedde3}*{box-sizing:border-box}body{margin:0;background:#fffdfd;color:var(--ink);font:14px Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:22px 16px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.logo{font:28px Georgia,serif;letter-spacing:1px}.hint{color:var(--muted);font-size:12px;line-height:1.7}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.panel h2{font:24px Georgia,serif;margin:0 0 12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:999px;background:var(--dark);color:#fff;padding:10px 15px;font-weight:700}.secondary{background:#f7e8ed;color:var(--dark)}.tiny{padding:7px 10px;font-size:11px}a{color:var(--dark)}.status{padding:12px 14px;border-radius:12px;background:#f7e8ed;color:#7c4057;margin:12px 0;line-height:1.5}.hidden{display:none!important}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.tools input,.tools select{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:150px;flex:1}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.photo{width:100%;aspect-ratio:3/4;object-fit:contain;display:block;background:var(--pink)}.no-photo{display:grid;place-items:center;color:var(--muted)}.info{padding:11px}.code{font-size:12px;font-weight:700;color:var(--dark);letter-spacing:.4px}.name{font-weight:700;margin:6px 0;overflow-wrap:anywhere}.details{font-size:11px;line-height:1.6;color:var(--muted);overflow-wrap:anywhere}.actions{display:flex;gap:7px;flex-wrap:wrap;padding:0 11px 11px}.pagination{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}.page-info{font-size:12px;color:var(--muted);min-width:115px;text-align:center}.pagination button:disabled{opacity:.4;cursor:not-allowed}@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:580px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.panel{padding:14px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><header class="top"><div><div class="logo">Graceantjoy</div><div class="hint">STORE ADMIN · 手机壳图片图库</div></div><div class="row"><a href="./admin.html">返回管理后台</a><a href="./orders.html">订单管理</a><a href="./index.html">返回商店</a><button id="logout" class="btn secondary hidden" type="button">退出登录</button></div></header><div id="status" class="status">正在检查管理员登录…</div>
<section id="loginPanel" class="panel hidden"><h2>管理员登录</h2><form id="loginForm"><p><label>管理员邮箱<br><input id="email" type="email" required autocomplete="username" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-top:6px"></label></p><p><label>密码<br><input id="password" type="password" required autocomplete="current-password" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-top:6px"></label></p><button class="btn" type="submit">登录后台</button></form></section>
<section id="app" class="panel hidden"><h2>手机壳图片图库</h2><p class="hint">图片按 3:4 比例完整显示。可搜索款式编号、商品名称、手机品牌或适配型号；点击“编辑商品”会返回后台商品列表定位编辑入口。</p><div class="tools"><input id="search" type="search" placeholder="搜索编号 / 名称 / 手机型号"><select id="active"><option value="all">全部商品</option><option value="yes">仅已上架</option><option value="no">仅未上架</option></select><button id="refresh" class="btn secondary" type="button">刷新图库</button></div><div id="count" class="hint"></div><div id="grid" class="grid" style="margin-top:12px"></div><div id="pagination" class="pagination"></div></section></main>
<script>
(()=>{const URL="https://udpjnirtmuzmiwmgelua.supabase.co",KEY="sb_publishable_IpMDj4zQ9B3GuMW4JAH0SA_MgqdDC0G",db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let products=[],page=1;const PAGE=12;function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function money(v){return "RM "+Number(v||0).toFixed(2)}function show(id,on){$(id).classList.toggle("hidden",!on)}function msg(t,bad=false){$("status").textContent=t;$("status").style.background=bad?"#fde8e8":"#f7e8ed";$("status").style.color=bad?"#8a2434":"#7c4057"}
async function auth(){const {data:{session}}=await db.auth.getSession();if(!session){show("loginPanel",true);show("app",false);msg("请先登录已授权的管理员账号。");return}const {data,error}=await db.rpc("is_store_admin");if(error||data!==true){await db.auth.signOut();show("loginPanel",true);show("app",false);msg("此账号没有管理员权限，请检查 admin_users 授权。");return}show("loginPanel",false);show("app",true);show("logout",true);await load()}
async function load(){msg("正在读取商品图库…");const {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});if(error){msg("读取商品失败："+error.message,true);return}products=data||[];page=1;render();msg("图库已更新，共 "+products.length+" 件商品。")}
function render(){const q=$("search").value.trim().toLowerCase(),active=$("active").value;const list=products.filter(p=>{if(active==="yes"&&!p.is_active)return false;if(active==="no"&&p.is_active)return false;const models=Array.isArray(p.models)?p.models.join(" "):String(p.models||"");const code=p.product_code||("GA-"+String(p.id||"").replace(/-/g,"").slice(0,8).toUpperCase());return [code,p.name,p.brand,p.style,p.category,p.material,models].some(v=>String(v||"").toLowerCase().includes(q))});const pages=Math.max(1,Math.ceil(list.length/PAGE));page=Math.min(Math.max(page,1),pages);const shown=list.slice((page-1)*PAGE,page*PAGE);$("count").textContent='找到 '+list.length+' / '+products.length+' 件商品 · 每页 '+PAGE+' 件';$("grid").innerHTML=shown.length?shown.map(p=>{const code=p.product_code||("GA-"+String(p.id||"").replace(/-/g,"").slice(0,8).toUpperCase());const models=Array.isArray(p.models)?p.models:(typeof p.models==="string"?p.models.split(",").map(x=>x.trim()).filter(Boolean):[]);return '<article class="card">'+(p.image_url?'<img class="photo" loading="lazy" src="'+esc(p.image_url)+'" alt="'+esc(p.name||"手机壳")+'">':'<div class="photo no-photo">尚未上传图片</div>')+'<div class="info"><div class="code">'+esc(code)+'</div><div class="name">'+esc(p.name||"未命名商品")+'</div><div class="details">'+esc([p.brand,p.style||p.category,p.material].filter(Boolean).join(" · ")||"未设置分类")+'</div><div class="details" style="margin-top:5px">型号：'+esc(models.join("、")||"未设置")+'</div><div class="details" style="margin-top:5px">'+money(p.price)+' · 库存 '+Number(p.stock||0)+' · '+(p.is_active?'已上架':'未上架')+'</div></div><div class="actions"><button class="btn secondary tiny" type="button" data-copy="'+esc(code)+'">复制编号</button><button class="btn tiny" type="button" data-edit="'+esc(p.id)+'">前往商品后台</button></div></article>'}).join(""):'<div class="hint">没有找到符合条件的商品。</div>';$('pagination').innerHTML='<button class="btn secondary tiny" data-page="'+(page-1)+'" '+(page<=1?'disabled':'')+'>上一页</button><span class="page-info">第 '+page+' / '+pages+' 页</span><button class="btn secondary tiny" data-page="'+(page+1)+'" '+(page>=pages?'disabled':'')+'>下一页</button>'}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){msg("登录失败："+error.message,true);return}await auth()});$("logout").addEventListener("click",async()=>{await db.auth.signOut();location.reload()});$("refresh").addEventListener("click",load);$("search").addEventListener("input",()=>{page=1;render()});$("active").addEventListener("change",()=>{page=1;render()});$("pagination").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b&&!b.disabled){page=Number(b.dataset.page);render()}});$("grid").addEventListener("click",async e=>{const copy=e.target.closest("[data-copy]");if(copy){try{await navigator.clipboard.writeText(copy.dataset.copy);copy.textContent="已复制"}catch(_){window.prompt("请复制款式编号",copy.dataset.copy)}return}const edit=e.target.closest("[data-edit]");if(edit){location.href="./admin.html";return}});auth().catch(e=>msg("初始化失败："+e.message,true));
})();
</script></body></html>
