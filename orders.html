<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff5f7"><title>Graceantjoy · 订单管理</title>
<style>
:root{--pink:#fff5f7;--blush:#fbe8ee;--dark:#9d526d;--ink:#30272b;--muted:#897980;--line:#eedde3}*{box-sizing:border-box}body{margin:0;background:#fffdfd;color:var(--ink);font:14px Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1250px;margin:auto;padding:22px 16px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.logo{font:28px Georgia,serif;letter-spacing:1px}.hint{color:var(--muted);font-size:12px;line-height:1.7}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.panel h2{font:24px Georgia,serif;margin:0 0 12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:999px;background:var(--dark);color:#fff;padding:10px 15px;font-weight:700}.secondary{background:#f7e8ed;color:var(--dark)}.tiny{padding:7px 10px;font-size:11px}a{color:var(--dark)}.status{padding:12px 14px;border-radius:12px;background:#f7e8ed;color:#7c4057;margin:12px 0;line-height:1.5}.hidden{display:none!important}.filters{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin:14px 0}.filters input,.filters select{width:100%;min-width:0;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}th{color:var(--muted);white-space:nowrap}.hintline{display:block;color:var(--muted);font-size:11px;line-height:1.6;margin-top:4px;overflow-wrap:anywhere}.pagination{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}.page-info{font-size:12px;color:var(--muted);min-width:115px;text-align:center}.pagination button:disabled{opacity:.4;cursor:not-allowed}.mini-select{padding:7px;border:1px solid var(--line);border-radius:8px;background:white;max-width:165px}.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{background:var(--pink);border-radius:12px;padding:14px}.stat strong{display:block;font:24px Georgia,serif;color:var(--dark);margin-top:5px}@media(max-width:800px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.summary-grid{grid-template-columns:1fr}.panel{padding:14px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap">
<header class="top"><div><div class="logo">Graceantjoy</div><div class="hint">STORE ADMIN · 独立订单管理</div></div><div class="row"><a href="./admin.html">返回管理后台</a><a href="./index.html">返回商店</a><button id="logout" class="btn secondary hidden" type="button">退出登录</button></div></header>
<div id="status" class="status">正在检查管理员登录…</div>
<section id="loginPanel" class="panel hidden"><h2>管理员登录</h2><form id="loginForm"><p><label>管理员邮箱<br><input id="email" type="email" autocomplete="username" required style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-top:6px"></label></p><p><label>密码<br><input id="password" type="password" autocomplete="current-password" required style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-top:6px"></label></p><button class="btn" type="submit">登录后台</button></form><p class="hint">请使用已授权的 Supabase 管理员账号。</p></section>
<section id="app" class="hidden"><section class="panel"><h2>订单概览</h2><div class="summary-grid"><div class="stat">筛选后的订单数<strong id="statCount">0</strong></div><div class="stat">筛选后的订单金额<strong id="statTotal">RM 0.00</strong></div><div class="stat">本页订单数<strong id="statPage">0</strong></div></div><div class="filters"><input id="search" type="search" placeholder="订单编号 / 姓名 / 电话 / 款式编号"><select id="year"><option value="">所有年份</option></select><select id="month"><option value="">所有月份</option><option value="01">1 月</option><option value="02">2 月</option><option value="03">3 月</option><option value="04">4 月</option><option value="05">5 月</option><option value="06">6 月</option><option value="07">7 月</option><option value="08">8 月</option><option value="09">9 月</option><option value="10">10 月</option><option value="11">11 月</option><option value="12">12 月</option></select><input id="fromDate" type="date" aria-label="开始日期"><input id="toDate" type="date" aria-label="结束日期"></div><div class="row"><button id="clearFilters" class="btn secondary" type="button">清除筛选</button><button id="refresh" class="btn secondary" type="button">刷新订单</button><span class="hint">每页固定显示 15 张订单</span></div><div id="summary" class="status">正在读取订单…</div></section>
<section class="panel"><div class="table-wrap"><table><thead><tr><th>订单编号 / 时间</th><th>顾客资料</th><th>商品明细 / 款式编号</th><th>付款方式 / 付款状态</th><th>金额</th><th>订单状态</th><th>保存修改</th></tr></thead><tbody id="orderRows"></tbody></table></div><div id="pagination" class="pagination"></div></section></section></main>
<script>
(()=>{const URL="https://udpjnirtmuzmiwmgelua.supabase.co",KEY="sb_publishable_IpMDj4zQ9B3GuMW4JAH0SA_MgqdDC0G",db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let orders=[],products=[],page=1;const PAGE=15;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function money(v){return "RM "+Number(v||0).toFixed(2)}function show(id,on){$(id).classList.toggle("hidden",!on)}function msg(t,bad=false){$("status").textContent=t;$("status").style.background=bad?"#fde8e8":"#f7e8ed";$("status").style.color=bad?"#8a2434":"#7c4057"}
async function auth(){const {data:{session}}=await db.auth.getSession();if(!session){show("loginPanel",true);show("app",false);msg("请先登录已授权的管理员账号。");return}const {data,error}=await db.rpc("is_store_admin");if(error||data!==true){await db.auth.signOut();show("loginPanel",true);show("app",false);msg("此账号没有管理员权限，请检查 admin_users 授权。");return}show("loginPanel",false);show("app",true);show("logout",true);await load()}
async function load(){$("summary").textContent="正在读取订单和商品资料…";const [o,p]=await Promise.all([db.from("orders").select("*").order("created_at",{ascending:false}),db.from("products").select("id,name,product_code,price,image_url")]);if(o.error){$("summary").textContent="读取订单失败："+o.error.message;return}orders=o.data||[];products=p.error?[]:(p.data||[]);const years=[...new Set(orders.map(o=>String(o.created_at||o.created||"").slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort().reverse();const prev=$("year").value;$("year").innerHTML='<option value="">所有年份</option>'+years.map(y=>'<option value="'+y+'">'+y+' 年</option>').join("");if(years.includes(prev))$("year").value=prev;page=1;render();$("summary").textContent="已读取 "+orders.length+" 张订单。款式编号会优先读取订单商品快照，若订单未保存编号，则尝试根据商品 ID 对照商品表。"}
function itemsOf(o){let a=o.items;if(typeof a==="string"){try{a=JSON.parse(a)}catch(e){a=[]}}return Array.isArray(a)?a:[]}
function itemHtml(o){const arr=itemsOf(o);if(!arr.length)return '<span class="hintline">订单没有保存商品明细</span>';return arr.map(i=>{const pid=i.product_id||i.productId||i.id;const p=products.find(x=>String(x.id)===String(pid));const code=i.product_code||i.style_code||i.productCode||i.styleCode||(p&&p.product_code)||"未记录编号";const name=i.product_name||i.name||(p&&p.name)||"商品";const model=i.phone_model||i.model||i.phoneModel||"未记录型号";const qty=Number(i.quantity||i.qty||1);return '<strong>'+esc(code)+'</strong> · '+esc(name)+'<span class="hintline">型号：'+esc(model)+' · 数量：'+qty+'</span>'}).join('<div style="height:8px"></div>')}
function opts(arr,v){return arr.map(([k,t])=>'<option value="'+k+'" '+(String(v||"")===k?'selected':'')+'>'+t+'</option>').join("")}
function filtered(){const q=$("search").value.trim().toLowerCase(),y=$("year").value,m=$("month").value,from=$("fromDate").value,to=$("toDate").value;return orders.filter(o=>{const dt=String(o.created_at||o.created||"");if(y&&dt.slice(0,4)!==y)return false;if(m&&dt.slice(5,7)!==m)return false;if(from&&dt.slice(0,10)<from)return false;if(to&&dt.slice(0,10)>to)return false;const its=itemsOf(o);const itemText=its.flatMap(i=>{const pid=i.product_id||i.productId||i.id,p=products.find(x=>String(x.id)===String(pid));return [i.product_code,i.style_code,i.productCode,i.styleCode,p&&p.product_code,i.product_name,i.name,i.model,i.phone_model]}).join(" ");return [o.order_number,o.customer_name,o.name,o.phone,o.payment_method,o.payment_status,o.order_status,o.status,itemText].some(v=>String(v||"").toLowerCase().includes(q))})}
function render(){const list=filtered(),pages=Math.max(1,Math.ceil(list.length/PAGE));page=Math.max(1,Math.min(page,pages));const shown=list.slice((page-1)*PAGE,page*PAGE);$("statCount").textContent=list.length;$("statTotal").textContent=money(list.reduce((s,o)=>s+Number(o.total??o.total_amount??0),0));$("statPage").textContent=shown.length;const payOpts=[['unpaid','未付款'],['awaiting_verification','等待核对'],['paid','已确认到账'],['refunded','已退款']];const orderOpts=[['pending_payment','待付款'],['processing','备货中'],['shipped','已发货'],['completed','已完成'],['cancelled','已取消']];$("orderRows").innerHTML=shown.length?shown.map(o=>{const n=o.order_number||o.id||"—",id=String(o.id||n),pay=o.payment_status||"unpaid",st=o.order_status||o.status||"pending_payment";return '<tr><td><strong>'+esc(n)+'</strong><span class="hintline">'+esc(o.created_at||o.created||"—")+'</span></td><td><strong>'+esc(o.customer_name||o.name||"—")+'</strong><span class="hintline">'+esc(o.phone||"—")+'</span><span class="hintline">'+esc(o.delivery_address||o.address||"—")+'</span></td><td>'+itemHtml(o)+'</td><td>'+esc(o.payment_method||o.payment||"—")+'<span class="hintline">付款状态</span><select class="mini-select" data-pay="'+esc(id)+'">'+opts(payOpts,pay)+'</select></td><td><strong>'+money(o.total??o.total_amount??0)+'</strong><span class="hintline">运费 '+money(o.shipping_fee||0)+'</span></td><td><select class="mini-select" data-order="'+esc(id)+'">'+opts(orderOpts,st)+'</select></td><td><button class="btn tiny" type="button" data-save="'+esc(id)+'">保存</button><span class="hintline" id="save-'+esc(id)+'"></span></td></tr>'}).join(""):'<tr><td colspan="7">没有符合条件的订单。</td></tr>';
$("pagination").innerHTML='<button class="btn secondary tiny" data-page="'+(page-1)+'" '+(page<=1?'disabled':'')+'>上一页</button><span class="page-info">第 '+page+' / '+pages+' 页</span><button class="btn secondary tiny" data-page="'+(page+1)+'" '+(page>=pages?'disabled':'')+'>下一页</button>';$("summary").textContent='当前筛选 '+list.length+' 张订单，显示第 '+(list.length?(page-1)*PAGE+1:0)+'–'+Math.min(page*PAGE,list.length)+' 张。';}
async function saveOrder(id){const o=orders.find(x=>String(x.id||x.order_number)===String(id));if(!o)return;const pay=document.querySelector('[data-pay="'+CSS.escape(String(id))+'"]'),st=document.querySelector('[data-order="'+CSS.escape(String(id))+'"]'),label=$("save-"+id);label.textContent="保存中…";const patch={};if(pay)patch.payment_status=pay.value;if(st){if(Object.prototype.hasOwnProperty.call(o,"order_status")||!Object.prototype.hasOwnProperty.call(o,"status"))patch.order_status=st.value;else patch.status=st.value}const key=o.id?"id":"order_number",val=o.id||o.order_number;const {error}=await db.from("orders").update(patch).eq(key,val);if(error){label.textContent="失败："+error.message;return}label.textContent="已保存";await load()}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){msg("登录失败："+error.message,true);return}await auth()});$("logout").addEventListener("click",async()=>{await db.auth.signOut();location.reload()});$("refresh").addEventListener("click",load);["search","year","month","fromDate","toDate"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",()=>{page=1;render()}));$("clearFilters").addEventListener("click",()=>{["search","year","month","fromDate","toDate"].forEach(id=>$(id).value="");page=1;render()});$("pagination").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b&&!b.disabled){page=Number(b.dataset.page);render()}});$("orderRows").addEventListener("click",e=>{const b=e.target.closest("[data-save]");if(b)saveOrder(b.dataset.save)});auth().catch(e=>msg("初始化失败："+e.message,true));
})();
</script></body></html>
