    if(!html.includes(gallery)) throw new Error("找不到图库页面结构，已停止加载以保护原后台。");

    const enhancement=String.raw`
const FIN_KEY="gj_admin_finance_v1";
let financeData=loadFinanceData();
function loadFinanceData(){try{const x=JSON.parse(localStorage.getItem(FIN_KEY)||"{}");return{records:Array.isArray(x.records)?x.records:[],stock:Array.isArray(x.stock)?x.stock:[],sales:Array.isArray(x.sales)?x.sales:[]}}catch(_){return{records:[],stock:[],sales:[]}}}
function saveFinanceData(){localStorage.setItem(FIN_KEY,JSON.stringify(financeData))}
function isoToday(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function initFinance(){if(!$("finDate").value)$("finDate").value=isoToday();if(!$("saleDate").value)$("saleDate").value=isoToday();if(!$("finReportMonth").value)$("finReportMonth").value=isoToday().slice(0,7);if(!$("finReportYear").value)$("finReportYear").value=isoToday().slice(0,4);if(!$("finStockItemList").children.length)addFinanceItem();toggleFinance()}
function addOrderAllocation(){const b=document.createElement("div");b.className="finance-order-allocation";b.style.cssText="display:grid;grid-template-columns:minmax(0,2fr) minmax(80px,1fr) auto;gap:10px;align-items:end;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0";b.innerHTML='<div class="field"><label>订单编号 / 顾客</label><select data-order-select><option value="">选择顾客订单</option></select></div><div class="field"><label>数量</label><input data-order-qty type="number" min="1" step="1" value="1"></div><button class="btn secondary tiny" type="button" data-remove-order>删除</button>';b.querySelector("[data-remove-order]").addEventListener("click",()=>{b.remove();updateAllocationSummary()});b.querySelector("[data-order-qty]").addEventListener("input",updateAllocationSummary);$("finOrderAllocationList").appendChild(b);refreshAllocationOrderOptions();updateAllocationSummary()}
function refreshAllocationOrderOptions(){const eligible=(orders||[]).filter(o=>String(o.order_status||o.status||"").toLowerCase()!=="cancelled");$("finOrderAllocationList").querySelectorAll("[data-order-select]").forEach(sel=>{const old=sel.value;sel.innerHTML='<option value="">选择顾客订单</option>'+eligible.map(o=>'<option value="'+esc(o.order_number||o.id)+'">'+esc(o.order_number||o.id)+' · '+esc(o.customer_name||o.name||o.customer||"顾客")+'</option>').join("");sel.value=old;sel.addEventListener("change",updateAllocationSummary)})}
function updateAllocationSummary(){const a=[...$("finOrderAllocationList").querySelectorAll(".finance-order-allocation")].reduce((s,b)=>s+(Number(b.querySelector("[data-order-qty]").value)||0),0),st=[...$("finStockItemList").querySelectorAll(".finance-stock-item")].reduce((s,b)=>s+(Number(b.querySelector("[data-qty]").value)||0),0);$("finAllocationSummary").textContent="顾客订单分配："+a+" 个；现货："+st+" 个；合计应等于进货总数量。"}
function addFinanceItem(){const b=document.createElement("div");b.className="finance-stock-item";b.style.cssText="border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0";b.innerHTML='<div class="row" style="justify-content:space-between;margin-bottom:8px"><strong>现货商品明细</strong><button type="button" class="btn secondary tiny" data-remove-fin-item>删除</button></div><div class="grid"><div class="field"><label>商品编号</label><input data-code placeholder="例如 001" maxlength="60"></div><div class="field"><label>型号</label><input data-model placeholder="例如 iPhone 17" maxlength="100"></div><div class="field"><label>数量</label><input data-qty type="number" min="1" step="1" value="1"></div><div class="field"><label>单个成本（RM）</label><input data-cost type="number" min="0" step=".01" value="10"></div></div><div class="hint" data-total style="margin-top:8px">此款总成本：RM 10.00</div>';const update=()=>{b.querySelector("[data-total]").textContent="此款总成本：RM "+((Number(b.querySelector("[data-qty]").value)||0)*(Number(b.querySelector("[data-cost]").value)||0)).toFixed(2)};b.addEventListener("input",()=>{update();updateAllocationSummary()});b.querySelector("[data-remove-fin-item]").addEventListener("click",()=>{b.remove();if(!$("finStockItemList").children.length)addFinanceItem()});$("finStockItemList").appendChild(b);update()}
function toggleFinance(){const t=$("finType").value;show("finPurchaseFields",t==="purchase");show("finShippingFields",t==="shipping");show("finOtherFields",t==="other");show("finStockItems",t==="purchase"&&$("finIsStock").checked)}
function overviewRange(){const mode=$("overviewPeriod").value||"month",today=isoToday();if(mode==="month"){const m=$("overviewMonth").value||today.slice(0,7);const last=new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0).getDate();return [m+"-01",m+"-"+String(last).padStart(2,"0")]}if(mode==="year"){const y=String($("overviewYear").value||today.slice(0,4));return [y+"-01-01",y+"-12-31"]}return [$("overviewStart").value||today,$("overviewEnd").value||today]}
function allocatedOrderCostInRange(start,end){return financeData.records.filter(r=>r.type==="purchase"&&Array.isArray(r.allocations)).reduce((sum,r)=>sum+r.allocations.reduce((sub,a)=>{const o=(orders||[]).find(o=>String(o.order_number||o.id)===String(a.orderNumber)),d=o?orderTimestamp(o):null,day=d?d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"):r.date;return sub+(day>=start&&day<=end?Number(a.cost||0):0)},0),0)}
function renderFinanceOverview(){const mode=$("overviewPeriod").value||"month",today=isoToday();if(!$("overviewMonth").value)$("overviewMonth").value=today.slice(0,7);if(!$("overviewYear").value)$("overviewYear").value=today.slice(0,4);if(!$("overviewStart").value)$("overviewStart").value=today.slice(0,7)+"-01";if(!$("overviewEnd").value)$("overviewEnd").value=today;show("overviewMonthWrap",mode==="month");show("overviewYearWrap",mode==="year");show("overviewStartWrap",mode==="custom");show("overviewEndWrap",mode==="custom");const [start,end]=overviewRange();if(start>end){$("overviewStats").innerHTML="开始日期不能晚于结束日期。";return}const rs=financeData.records.filter(r=>r.date>=start&&r.date<=end),purchases=rs.filter(r=>r.type==="purchase").reduce((s,r)=>s+Number(r.amount||0),0),shipping=rs.filter(r=>r.type==="shipping").reduce((s,r)=>s+Number(r.amount||0),0),other=rs.filter(r=>r.type==="other").reduce((s,r)=>s+Number(r.amount||0),0),rev=(orders||[]).filter(o=>{const d=orderTimestamp(o);if(!d)return false;const day=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");return day>=start&&day<=end&&["paid","completed","confirmed","success","successful"].includes(String(o.payment_status||"").toLowerCase())&&String(o.order_status||o.status||"").toLowerCase()!=="cancelled"}).reduce((s,o)=>s+orderRevenue(o),0),soldCost=financeData.sales.filter(x=>x.date>=start&&x.date<=end).reduce((s,x)=>s+Number(x.cost||0),0)+allocatedOrderCostInRange(start,end),stockValue=financeData.stock.reduce((s,x)=>s+Math.max(0,Number(x.remainingQty)||0)*Number(x.unitCost||0),0),spend=purchases+shipping+other,profit=rev-soldCost-shipping-other,cash=rev-spend;const cards=[["顾客已付款金额",rev],["总支出（进货＋邮寄＋其他）",spend],["进货支出",purchases],["邮寄费用",shipping],["其他开销",other],["现货剩余价值（当前）",stockValue],["经营净利润估算",profit],["现金收支（进货全额计支出）",cash]];$("overviewStats").innerHTML=cards.map(c=>'<div class="stat-card"><div class="stat-label">'+esc(c[0])+'</div><div class="stat-value '+(N
