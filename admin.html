<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff5f7"><title>Graceantjoy · Admin</title>
<style>
:root{--pink:#fff5f7;--blush:#fbe8ee;--dark:#9d526d;--ink:#30272b;--muted:#897980;--line:#eedde3}*{box-sizing:border-box}body{margin:0;background:#fffdfd;color:var(--ink);font:14px Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:22px 16px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}.logo{font:28px Georgia,serif;letter-spacing:1px}.sub,.hint{color:var(--muted);font-size:12px;line-height:1.7}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px}.panel h2{font:24px Georgia,serif;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-size:12px;color:#6f5c64}input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}textarea{min-height:80px}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.btn{border:0;border-radius:999px;background:var(--dark);color:white;padding:11px 17px;font-weight:700}.secondary{background:#f7e8ed;color:var(--dark)}.danger{background:#8a354a}.tiny{padding:7px 10px;font-size:11px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.status{padding:12px 14px;border-radius:12px;background:#f7e8ed;color:#7c4057;margin:12px 0;line-height:1.5}.hidden{display:none!important}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}th{color:var(--muted)}td img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:var(--pink)}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:15px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap">
<header class="top"><div><div class="logo">Graceantjoy</div><div class="sub">STORE ADMIN · 商品管理后台</div></div><div class="row"><a href="./index.html">返回商店</a><button id="logoutBtn" class="btn secondary hidden" type="button">退出登录</button></div></header>
<div id="status" class="status">正在初始化安全登录…</div>
<section id="loginPanel" class="panel hidden"><h2>管理员登录</h2><form id="loginForm" class="grid"><div class="field full"><label for="email">管理员邮箱</label><input id="email" type="email" autocomplete="username" required></div><div class="field full"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required></div><div class="field full"><button class="btn" type="submit">登录后台</button></div></form><p class="hint">请使用 Supabase Authentication → Users 中已创建并授权的管理员账号。</p></section>
<section id="dashboard" class="hidden"><section class="panel"><h2 id="formTitle">新增商品</h2><form id="productForm" class="grid"><input id="productId" type="hidden">
<div class="field"><label for="name">商品名称 *</label><input id="name" required maxlength="160"></div><div class="field"><label for="productCode">款式编号（留空自动生成）</label><input id="productCode" maxlength="40" placeholder="例如 GA-0001"></div><div class="field"><label for="brand">手机品牌 *</label><input id="brand" value="Apple" required></div><div class="field"><label for="style">款式分类 *</label><input id="style" value="New Arrivals" required></div><div class="field"><label for="material">材质 *</label><input id="material" value="Hard Case" required></div><div class="field"><label for="price">售价（RM）*</label><input id="price" type="number" min="0" step=".01" required></div><div class="field"><label for="comparePrice">原价（RM，可选）</label><input id="comparePrice" type="number" min="0" step=".01"></div>
<div class="field"><label for="promoQuantity">优惠购买数量（例如 2；留空则不启用）</label><input id="promoQuantity" type="number" min="2" step="1" placeholder="例如：2"></div><div class="field"><label for="promoPrice">混搭优惠总价 RM（例如 35）</label><input id="promoPrice" type="number" min="0" step=".01" placeholder="例如：35" value="35"></div><div class="field full check"><input id="promoMixMatch" type="checkbox"><label for="promoMixMatch">参加混搭优惠（勾选后可与其他勾选的商品组合，例如星星人 + 哭娃 = 2 件 RM35）</label></div>
<div class="field"><label for="stock">库存 *</label><input id="stock" type="number" min="0" step="1" value="0" required></div><div class="field"><label for="models">适配手机型号 *（用英文逗号分隔）</label><input id="models" placeholder="iPhone 17, iPhone 16" required></div><div class="field full"><label for="description">商品介绍</label><textarea id="description"></textarea></div><div class="field full"><label for="imageFile">商品图片（上传新图可替换现有图片）</label><input id="imageFile" type="file" accept="image/*"><div id="imagePreview" class="hint"></div></div><div class="field full"><label for="imageUrl">图片网址（可选）</label><input id="imageUrl" type="url" placeholder="https://..."></div><div class="field full check"><input id="active" type="checkbox"><label for="active">上架（勾选后访客可以看到）</label></div><div class="field full row"><button class="btn" type="submit">保存商品</button><button id="cancelEdit" class="btn secondary hidden" type="button">取消编辑</button></div></form></section>
<section class="panel"><div class="row" style="justify-content:space-between"><h2>商品列表</h2><button id="refreshBtn" class="btn secondary" type="button">刷新</button></div><div class="table-wrap"><table><thead><tr><th>图片</th><th>商品</th><th>价格 / 优惠</th><th>库存</th><th>状态</th><th>操作</th></tr></thead><tbody id="productRows"></tbody></table></div></section><p class="hint">不要把 Supabase Secret/service_role key 放入网页。商品修改权限由 Supabase RLS 和管理员授权函数控制。</p></section></main>
<script>
(()=>{const URL="https://udpjnirtmuzmiwmgelua.supabase.co",KEY="sb_publishable_IpMDj4zQ9B3GuMW4JAH0SA_MgqdDC0G",client=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let rows=[],currentImage="";
function msg(t,bad=false){$("status").textContent=t;$("status").style.background=bad?"#fde8e8":"#f7e8ed";$("status").style.color=bad?"#8a2434":"#7c4057"}function show(id,on){$(id).classList.toggle("hidden",!on)}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function money(v){return "RM "+Number(v||0).toFixed(2)}
async function checkAdmin(){const {data:{session}}=await client.auth.getSession();if(!session){show("loginPanel",true);show("dashboard",false);show("logoutBtn",false);msg("请使用已授权的管理员账号登录。");return}const {data,error}=await client.rpc("is_store_admin");if(error||data!==true){await client.auth.signOut();show("loginPanel",true);show("dashboard",false);show("logoutBtn",false);msg("此账号没有管理员权限。请确认 UID 已加入 admin_users。",true);return}show("loginPanel",false);show("dashboard",true);show("logoutBtn",true);await loadProducts()}
async function loadProducts(){msg("正在读取商品…");const {data,error}=await client.from("products").select("*").order("created_at",{ascending:false});if(error){msg("读取商品失败："+error.message,true);return}rows=data||[];renderRows();msg("已加载 "+rows.length+" 件商品。")}
function renderRows(){$("productRows").innerHTML=rows.length?rows.map(p=>'<tr><td>'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="">':"—")+'</td><td><strong>'+esc(p.name)+'</strong><br><span class="hint">编号：'+esc(p.product_code||('GA-'+String(p.id).replace(/-/g,'').slice(0,8).toUpperCase()))+' · '+esc(p.brand)+' · '+esc(p.style||p.category||"")+'</span></td><td>'+money(p.price)+(p.promo_quantity&&p.promo_price?'<br><span class="hint">买 '+esc(p.promo_quantity)+' 件 RM '+Number(p.promo_price).toFixed(2)+'</span>':"")+(p.compare_at_price?'<br><span class="hint">原价 '+money(p.compare_at_price)+'</span>':"")+'</td><td>'+Number(p.stock||0)+'</td><td>'+(p.is_active?"已上架":"未上架")+'</td><td><div class="row"><button class="btn secondary tiny" data-edit="'+esc(p.id)+'" type="button">编辑</button><button class="btn danger tiny" data-delete="'+esc(p.id)+'" type="button">删除</button></div></td></tr>').join(""):'<tr><td colspan="6">暂时没有商品，请在上方新增。</td></tr>'}
function resetForm(){$("productForm").reset();$("productId").value="";$("productCode").value="";$("brand").value="Apple";$("style").value="New Arrivals";$("material").value="Hard Case";$("stock").value="0";$("promoQuantity").value="2";$("promoPrice").value="35";$("promoMixMatch").checked=false;$("active").checked=false;currentImage="";$("imageUrl").value="";$("imagePreview").textContent="";$("formTitle").textContent="新增商品";show("cancelEdit",false)}
function editProduct(id){const p=rows.find(x=>String(x.id)===String(id));if(!p)return;$("productId").value=p.id;$("name").value=p.name||"";$("productCode").value=p.product_code||"";$("brand").value=p.brand||"Apple";$("style").value=p.style||p.category||"New Arrivals";$("material").value=p.material||"Hard Case";$("price").value=p.price??0;$("comparePrice").value=p.compare_at_price??"";$("promoQuantity").value=p.promo_quantity??2;$("promoPrice").value=p.promo_price??35;$("promoMixMatch").checked=!!p.promo_mix_match;$("stock").value=p.stock??0;$("models").value=(p.models||[]).join(", ");$("description").value=p.description||"";$("imageUrl").value=p.image_url||"";$("active").checked=!!p.is_active;currentImage=p.image_url||"";$("imagePreview").textContent=currentImage?"当前图片已设置。":"";$("formTitle").textContent="编辑商品";show("cancelEdit",true);window.scrollTo({top:0,behavior:"smooth"})}
async function uploadImage(file){const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg",path="products/"+crypto.randomUUID()+"."+ext;const {error}=await client.storage.from("product-images").upload(path,file,{upsert:false,contentType:file.type||"image/jpeg"});if(error)throw error;return client.storage.from("product-images").getPublicUrl(path).data.publicUrl}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();msg("正在验证登录…");const {error}=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){msg("登录失败："+error.message,true);return}await checkAdmin()});$("logoutBtn").addEventListener("click",async()=>{await client.auth.signOut();resetForm();await checkAdmin()});$("refreshBtn").addEventListener("click",loadProducts);$("cancelEdit").addEventListener("click",resetForm);$("imageFile").addEventListener("change",()=>{const f=$("imageFile").files[0];$("imagePreview").textContent=f?"已选择："+f.name+"（保存时上传）":""});
$("productForm").addEventListener("submit",async e=>{e.preventDefault();const id=$("productId").value;try{msg("正在保存商品…");let imageUrl=$("imageUrl").value.trim()||currentImage;const file=$("imageFile").files[0];if(file){if(file.size>8*1024*1024){msg("图片请控制在 8MB 以内。",true);return}imageUrl=await uploadImage(file)}const mix=$("promoMixMatch").checked,pq=mix?($("promoQuantity").value||"2"):$("promoQuantity").value,pp=mix?($("promoPrice").value||"35"):$("promoPrice").value;if(mix&&(!pq||!pp||Number(pq)<2||Number(pp)<=0)){msg("混搭优惠数量至少为 2，并且需要填写优惠总价。",true);return}if(!mix&&((pq&&!pp)||(!pq&&pp)||(pq&&Number(pq)<2)||(pp&&Number(pp)<=0))){msg("如不参加混搭优惠，请清空优惠数量和优惠总价；如填写则需两项完整。",true);return}
const enteredCode=$("productCode").value.trim().toUpperCase();const payload={product_code:enteredCode||(id?(rows.find(x=>String(x.id)===String(id))?.product_code||""):('GA-'+crypto.randomUUID().replace(/-/g,'').slice(0,8).toUpperCase())),name:$("name").value.trim(),brand:$("brand").value.trim(),style:$("style").value.trim(),category:$("style").value.trim(),material:$("material").value.trim(),price:Number($("price").value),compare_at_price:$("comparePrice").value===""?null:Number($("comparePrice").value),promo_quantity:mix?Number(pq):null,promo_price:mix?Number(pp):null,promo_mix_match:mix,stock:Number($("stock").value),models:$("models").value.split(",").map(x=>x.trim()).filter(Boolean),description:$("description").value.trim(),image_url:imageUrl,is_active:$("active").checked};if(!payload.models.length){msg("请至少填写一个适配手机型号。",true);return}const result=id?await client.from("products").update(payload).eq("id",id).select().single():await client.from("products").insert(payload).select().single();if(result.error)throw result.error;resetForm();await loadProducts();msg("商品保存成功。")}catch(err){msg("保存失败："+(err.message||String(err)),true)}});
$("productRows").addEventListener("click",async e=>{const edit=e.target.closest("[data-edit]"),del=e.target.closest("[data-delete]");if(edit){editProduct(edit.dataset.edit);return}if(del&&confirm("确定删除这件商品吗？")){const {error}=await client.from("products").delete().eq("id",del.dataset.delete);if(error){msg("删除失败："+error.message,true);return}await loadProducts();msg("商品已删除。")}});checkAdmin().catch(e=>msg("初始化失败："+e.message,true))})();
</script></body></html>
