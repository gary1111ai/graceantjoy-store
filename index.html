<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff5f7">
<title>Graceantjoy — Phone Cases with a Little Joy</title>
<style>
body{font-family:Arial,sans-serif;background:#fff5f7;color:#30272b;padding:24px;line-height:1.6}
main{max-width:620px;margin:8vh auto;background:#fff;border-radius:18px;padding:24px}
</style>
</head>
<body>
<main>
  <strong>Graceantjoy</strong>
  <p id="status">Loading store…</p>
</main>
<script>
(async function () {
  const status = document.getElementById("status");
  const sourceUrl = "https://raw.githubusercontent.com/gary1111ai/graceantjoy-store/2e3fc9cd9c8e04f28152840c7b64db85a4e56e24/index.html";

  try {
    const response = await fetch(sourceUrl, {cache:"no-store"});
    if (!response.ok) throw new Error("Could not load original storefront (" + response.status + ").");
    let html = await response.text();

    const replacements = [
      [
        '<div class="filters"><input class="field" id="search" placeholder="Search cases or phone model"><select class="field" id="styleFilter"><option value="">All styles</option></select><select class="field" id="materialFilter"><option value="">All materials</option><option>Hard Case</option><option>Soft Case</option><option>Other</option></select><select class="field" id="brandFilter"><option value="">All phone brands</option><option>Apple</option><option>Samsung</option><option>Huawei</option><option>Xiaomi</option><option>Other</option></select></div>',
        '<div class="filters"><input class="field" id="search" placeholder="Search cases or phone model"><select class="field" id="styleFilter"><option value="">All styles</option></select></div>'
      ],
      [
        '.filters{display:grid;grid-template-columns:1fr 170px 170px 170px;gap:9px;margin-bottom:18px}',
        '.filters{display:grid;grid-template-columns:1fr 170px;gap:9px;margin-bottom:18px}'
      ],
      [
        "var q=$('search').value.trim().toLowerCase(),style=$('styleFilter').value,mat=$('materialFilter').value,brand=$('brandFilter').value;var list=products.filter(p=>(!q||[p.name,p.style,p.material,p.brand,p.description,...(p.models||[])].join(' ').toLowerCase().includes(q))&&(!style||p.style===style)&&(!mat||p.material===mat)&&(!brand||p.brand===brand));",
        "var q=$('search').value.trim().toLowerCase(),style=$('styleFilter').value;var list=products.filter(p=>(!q||[p.name,p.style,p.material,p.brand,p.description,...(p.models||[])].join(' ').toLowerCase().includes(q))&&(!style||p.style===style));"
      ],
      ["+' · '+safe(p.material||'Case')+'</div><h3>", "+'</div><h3>"],
      ["['search','styleFilter','materialFilter','brandFilter']", "['search','styleFilter']"],
      ["$('materialFilter').options[0].text=t('allMaterials');$('brandFilter').options[0].text=t('allBrands');", ""]
    ];

    for (const pair of replacements) {
      if (!html.includes(pair[0])) throw new Error("A storefront update did not match the source. No modified page was displayed.");
      html = html.replace(pair[0], pair[1]);
    }

    /* Show actual product photos in each cart line. */
    const cartOld = `return p?'<div class="cart-line"><div><strong>'+safe(p.name)+'</strong><small>'+safe(x.model)+'<br>'+Number(x.qty)+' × '+money(price(p))+'</small><div class="cart-qty">`;
    const cartNew = `return p?'<div class="cart-line"><div class="cart-product"><img class="gj-cart-thumb" src="'+safe(p.image||'')+'" alt="'+safe(p.name)+'" onerror="this.style.display=\\'none\\'"><div class="gj-cart-product-info"><strong>'+safe(p.name)+'</strong><small>'+safe(x.model)+'<br>'+Number(x.qty)+' × '+money(price(p))+'</small></div><div class="cart-qty">`;
    if (!html.includes(cartOld)) throw new Error("Could not safely update the shopping-bag product row.");
    html = html.replace(cartOld, cartNew);

    /* Preserve all existing checkout/payment code and add the visual feedback after a valid add. */
    const addOld = `if(item)item.qty=Number(item.qty)+qty;else cart.push({id:p.id,model:sel.value,qty:qty});save();renderCart()}`;
    const addNew = `if(item)item.qty=Number(item.qty)+qty;else cart.push({id:p.id,model:sel.value,qty:qty});save();renderCart();window.gjShowAddedToast(p,sel.value,qty)}`;
    if (!html.includes(addOld)) throw new Error("Could not safely update the add-to-bag feedback.");

    /* Remove any duplicate material/brand filters if source structure changes unexpectedly. */
    if (html.includes('id="materialFilter"') || html.includes('id="brandFilter"') || html.includes("safe(p.material||'Case')")) {
      throw new Error("Material/brand filters were not fully removed.");
    }

    /* Patch order lookup JS so its Chinese/English button says Track Order / 查询订单
       and each item displays the product image saved with the order. */
    const orderResponse = await fetch("./graceantjoy-my-orders.js", {cache:"no-store"});
    if (!orderResponse.ok) throw new Error("Could not load the order lookup feature (" + orderResponse.status + ").");
    let orderJs = await orderResponse.text();

    orderJs = orderJs.replace('button: "My Orders"', 'button: "Track Order"');
    orderJs = orderJs.replace('button: "我的订单"', 'button: "查询订单"');

    const itemOld = `        box.appendChild(
          el("strong", "", item.product_name || item.name || t("item"))
        );`;
    const itemNew = `        const imageUrl = item.product_image || item.image || item.image_url || item.productImage || "";
        if (imageUrl) {
          const image = el("img", "gj-mo-item-image");
          image.src = imageUrl;
          image.alt = item.product_name || item.name || t("item");
          image.loading = "lazy";
          image.onerror = function () { image.style.display = "none"; };
          box.appendChild(image);
        }
        box.appendChild(
          el("strong", "", item.product_name || item.name || t("item"))
        );`;
    if (!orderJs.includes(itemOld)) throw new Error("Could not safely update the order lookup product images.");
    orderJs = orderJs.replace(itemOld, itemNew);

    const enhancement = `
<style id="gj-store-enhancements">
/* The bag remains reachable while the customer scrolls. */
/* Keep the original bag button in the header beside language/order controls. */
#cartOpen{position:relative!important;top:auto!important;right:auto!important;z-index:10!important;box-shadow:none!important;background:transparent!important}
.header{padding-right:0}
/* Second, always-accessible floating bag on the right side. */
#gj-floating-bag{position:fixed;right:14px;top:62%;transform:translateY(-50%);z-index:10040;width:54px;height:54px;border:1px solid #f0dce4;border-radius:50%;background:#fffdfd;color:#30272b;box-shadow:0 7px 24px #5e334326;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .18s ease,box-shadow .18s ease}
#gj-floating-bag:active{transform:translateY(-50%) scale(.93)}
#gj-floating-bag svg{width:23px;height:23px;display:block}
#gj-floating-bag-count{position:absolute;top:-5px;right:-4px;min-width:21px;height:21px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:#d96c91;color:#fff;font:700 11px/21px Arial,sans-serif;text-align:center;border:2px solid #fff;display:none}
body.gj-cart-open #gj-floating-bag{display:none!important}
.cart-product{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:start;gap:10px}
.gj-cart-thumb{width:64px;height:84px;object-fit:contain;background:#fff5f7;border:1px solid #eedde3;border-radius:9px;display:block}
.gj-cart-product-info{min-width:0}
.gj-cart-product-info strong{display:block;overflow-wrap:anywhere}
.gj-cart-product-info small{display:block}
.gj-added-toast{position:fixed;top:auto;bottom:calc(38% + 42px);right:14px;z-index:10060;background:#30272b;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 28px #0002;font-size:13px;max-width:min(88vw,340px);animation:gjToastIn .22s ease-out}
.gj-added-toast b{color:#ffd8e5}
@keyframes gjToastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
#gj-my-orders-modal .gj-mo-item-image{display:block;width:94px;height:118px;object-fit:contain;background:#fff5f7;border:1px solid #eedde3;border-radius:10px;margin:0 0 10px}
@media(max-width:480px){.header{padding-right:0}.cart-product{grid-template-columns:56px minmax(0,1fr);gap:8px}.gj-cart-thumb{width:56px;height:74px}#gj-floating-bag{right:12px;width:50px;height:50px;top:62%}}
</style>
<script>
(function(){
  const cartButton=document.getElementById("cartOpen");
  const cartOverlay=document.getElementById("cartOverlay");
  function syncCartButton(){
    document.body.classList.toggle("gj-cart-open",!!(cartOverlay&&cartOverlay.classList.contains("open")));
  }
  function installFloatingBag(){
    if(document.getElementById("gj-floating-bag")||!cartButton)return;
    const floating=document.createElement("button");
    floating.type="button";floating.id="gj-floating-bag";floating.setAttribute("aria-label","Open shopping bag");
    floating.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l1 12H4L5 8Z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><span id="gj-floating-bag-count"></span>';
    floating.addEventListener("click",()=>cartButton.click());
    document.body.appendChild(floating);
    function updateCount(){
      const badge=document.getElementById("gj-floating-bag-count");if(!badge)return;
      const lines=cartOverlay?cartOverlay.querySelectorAll(".cart-line"):[];
      let count=0;
      lines.forEach(line=>{const txt=line.innerText||"";const match=txt.match(/(?:×|x)\s*(\d+)/i);count+=match?Number(match[1]):1});
      if(count>0){badge.textContent=count>99?"99+":String(count);badge.style.display="block"}else{badge.textContent="";badge.style.display="none"}
    }
    if(cartOverlay){const observer=new MutationObserver(updateCount);observer.observe(cartOverlay,{subtree:true,childList:true,characterData:true,attributes:true});}
    document.addEventListener("click",()=>setTimeout(updateCount,100),true);
    window.gjUpdateFloatingBagCount=updateCount;updateCount();
  }
  installFloatingBag();
  if(cartButton&&cartOverlay){
    const observer=new MutationObserver(syncCartButton);
    observer.observe(cartOverlay,{attributes:true,attributeFilter:["class"]});
    cartButton.addEventListener("click",()=>requestAnimationFrame(syncCartButton));
    document.addEventListener("click",event=>{
      if(event.target.closest("[data-close='cartOverlay']"))requestAnimationFrame(syncCartButton);
      if(event.target===cartOverlay)requestAnimationFrame(syncCartButton);
    },true);
    document.addEventListener("keydown",event=>{
      if(event.key==="Escape")requestAnimationFrame(syncCartButton);
    });
    syncCartButton();
  }
})();
window.gjShowAddedToast=function(product,model,qty){
  const old=document.getElementById("gj-added-toast");if(old)old.remove();
  const toast=document.createElement("div");toast.id="gj-added-toast";toast.className="gj-added-toast";
  const name=product&&product.name?String(product.name):"Item";
  toast.innerHTML='<b>✓ Added to bag</b><br><span></span>';
  toast.querySelector("span").textContent=name+" · "+model+" × "+qty;
  document.body.appendChild(toast);
  const button=document.getElementById("gj-floating-bag");
  if(button){button.animate([{transform:"translateY(-50%) scale(1)"},{transform:"translateY(-50%) scale(1.12)"},{transform:"translateY(-50%) scale(1)"}],{duration:380,easing:"ease-out"});}
  if(window.gjUpdateFloatingBagCount)window.gjUpdateFloatingBagCount();
  window.clearTimeout(window.gjToastTimer);window.gjToastTimer=window.setTimeout(()=>toast.remove(),2800);
};
<\/script>`;

    html = html.replace(addOld, addNew);

    const scripts = '<script>' + orderJs + '<' + '/script>' +
      '<script src="./graceantjoy-done-payment.js?v=1"><' + '/script>' +
      enhancement + '</body>';
    if (!html.includes("</body>")) throw new Error("Could not find the storefront body end tag.");
    html = html.replace("</body>", scripts);

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    console.error("Graceantjoy storefront loading failed:", error);
    status.textContent = "The store could not load: " + (error && error.message ? error.message : "Unknown error");
  }
})();
</script>
</body>
</html>
