<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff5f7">
<title>Graceantjoy — Phone Cases with a Little Joy</title>
<style>
body{font-family:Arial,sans-serif;background:#fffdfd;color:#30272b;padding:24px;line-height:1.6}
main{max-width:620px;margin:8vh auto;background:#fff5f7;border-radius:18px;padding:24px}
</style>
</head>
<body>
<main>
  <strong>Graceantjoy</strong>
  <p id="status">Loading store…</p>
</main>
<script>
(async function () {
  const status = document.getElementById('status');
  // Load the original storefront from a fixed commit so this file does not load itself.
  const sourceUrl = 'https://raw.githubusercontent.com/gary1111ai/graceantjoy-store/2e3fc9cd9c8e04f28152840c7b64db85a4e56e24/index.html';
  try {
    const response = await fetch(sourceUrl, { cache: 'no-store' });
    if (!response.ok) throw new Error('Could not load the original storefront (' + response.status + ').');
    let html = await response.text();
    const replacements = [
      ['<div class="filters"><input class="field" id="search" placeholder="Search cases or phone model"><select class="field" id="styleFilter"><option value="">All styles</option></select><select class="field" id="materialFilter"><option value="">All materials</option><option>Hard Case</option><option>Soft Case</option><option>Other</option></select><select class="field" id="brandFilter"><option value="">All phone brands</option><option>Apple</option><option>Samsung</option><option>Huawei</option><option>Xiaomi</option><option>Other</option></select></div>', '<div class="filters"><input class="field" id="search" placeholder="Search cases or phone model"><select class="field" id="styleFilter"><option value="">All styles</option></select></div>'],
      ['.filters{display:grid;grid-template-columns:1fr 170px 170px 170px;gap:9px;margin-bottom:18px}', '.filters{display:grid;grid-template-columns:1fr 170px;gap:9px;margin-bottom:18px}'],
      ["var q=$('search').value.trim().toLowerCase(),style=$('styleFilter').value,mat=$('materialFilter').value,brand=$('brandFilter').value;var list=products.filter(p=>(!q||[p.name,p.style,p.material,p.brand,p.description,...(p.models||[])].join(' ').toLowerCase().includes(q))&&(!style||p.style===style)&&(!mat||p.material===mat)&&(!brand||p.brand===brand));", "var q=$('search').value.trim().toLowerCase(),style=$('styleFilter').value;var list=products.filter(p=>(!q||[p.name,p.style,p.material,p.brand,p.description,...(p.models||[])].join(' ').toLowerCase().includes(q))&&(!style||p.style===style));"],
      ["+' · '+safe(p.material||'Case')+'</div><h3>", "+'</div><h3>"],
      ["['search','styleFilter','materialFilter','brandFilter']", "['search','styleFilter']"],
      ["$('materialFilter').options[0].text=t('allMaterials');$('brandFilter').options[0].text=t('allBrands');", ""]
    ];
    for (const [before, after] of replacements) {
      if (!html.includes(before)) throw new Error('The source storefront has changed; safe automatic editing stopped.');
      html = html.replace(before, after);
    }
    if (html.includes('id="materialFilter"') || html.includes('id="brandFilter"') || html.includes("safe(p.material||'Case')")) throw new Error('Material and phone-brand filters were not fully removed; automatic editing stopped.');
    // Load the separate order-notification feature into the original storefront.
    if (!html.includes('</body>')) throw new Error('Could not find the storefront body end tag.');
    html = html.replace('</body>', '<script src="./graceantjoy-ig-order-notification.js"><\/script></body>');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    status.textContent = 'The store could not load automatically. Please check index.html and graceantjoy-ig-order-notification.js. Details: ' + error.message;
  }
})();
</script>
</body>
</html>
