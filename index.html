<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5f7">
  <title>Graceantjoy</title>

  <style>
    :root {
      --pink: #fff5f7;
      --rose: #c77e96;
      --dark: #9d526d;
      --ink: #30272b;
      --line: #eedde3;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffdfd;
      color: var(--ink);
    }

    /* 固定顶部导航 */
    .announcement {
      position: relative;
      z-index: 1001;
    }

    .header {
      position: sticky !important;
      top: 0;
      z-index: 1000;
      background: rgba(255, 253, 253, 0.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 12px 0 !important;
      gap: 10px;
    }

    .header > div {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .header .btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
      font-size: 12px;
      white-space: nowrap;
    }

    .brand-logo {
      display: block;
      width: 140px;
      max-width: 36vw;
      height: auto;
      object-fit: contain;
    }

    /* 搜索与筛选 */
    .filters {
      display: grid;
      grid-template-columns: 1fr 170px 170px 170px;
      gap: 9px;
      margin-bottom: 18px;
    }

    .field {
      min-width: 0;
    }

    /* 商品图片比例 */
    .product-image {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #fff;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain !important;
      display: block;
    }

    /* 加入购物袋成功提示 */
    #gj-cart-toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translate(-50%, 20px);
      z-index: 20000;
      background: #30272b;
      color: white;
      padding: 13px 20px;
      border-radius: 999px;
      font-size: 13px;
      box-shadow: 0 8px 28px #0002;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease, transform .22s ease;
      max-width: calc(100% - 32px);
      text-align: center;
      white-space: nowrap;
    }

    #gj-cart-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* 购物袋商品图片 */
    .cart-line {
      align-items: center;
      gap: 12px;
    }

    .gj-cart-thumb {
      width: 76px;
      height: 100px;
      flex: 0 0 76px;
      object-fit: contain;
      background: #fff5f7;
      border: 1px solid #eedde3;
      border-radius: 9px;
    }

    .gj-cart-details {
      flex: 1;
      min-width: 0;
    }

    .gj-cart-details strong {
      display: block;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .gj-cart-details small {
      line-height: 1.7;
    }

    .gj-cart-price {
      text-align: right;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .cart-qty {
      justify-content: flex-start;
    }

    .add:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    @media (max-width: 850px) {
      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .filters input {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 580px) {
      .brand-logo {
        width: 105px;
      }

      .header {
        gap: 6px;
      }

      .header > div {
        gap: 5px;
      }

      .header .btn {
        padding: 9px 10px;
        font-size: 11px;
      }

      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .gj-cart-thumb {
        width: 65px;
        height: 86px;
        flex-basis: 65px;
      }

      .cart-line {
        gap: 8px;
      }

      .gj-cart-price {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main style="max-width:620px;margin:10vh auto;padding:24px;text-align:center">
    <strong style="font:30px Georgia,serif;color:#9d526d">
      Graceantjoy
    </strong>
    <p id="gj-loading">正在加载商店……</p>
  </main>

  <script>
    (async function () {
      const loading = document.getElementById("gj-loading");

      /*
       * 使用原本的完整商店页面。
       * 不重新编写结账、优惠、Supabase 等核心逻辑。
       */
      const sourceURL =
        "https://raw.githubusercontent.com/gary1111ai/graceantjoy-store/2e3fc9cd9c8e04f28152840c7b64db85a4e56e24/index.html";

      try {
        const response = await fetch(sourceURL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("无法读取原本的商店页面");
        }

        let html = await response.text();

        if (!html.includes("</body>")) {
          throw new Error("商店页面内容不完整");
        }

        /*
         * 追加功能：
         * 1. 顾客订单查询
         * 2. 已完成付款后的复制订单流程
         * 3. 本次要求的页面优化
         */
        const extraScripts = `
<script src="./graceantjoy-my-orders.js?v=2"><\/script>
<script src="./graceantjoy-done-payment.js?v=2"><\/script>
<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);

  function currentLang() {
    return localStorage.getItem("gj_lang_v1") === "zh"
      ? "zh"
      : "en";
  }

  function text(zh, en) {
    return currentLang() === "zh" ? zh : en;
  }

  /* 创建加入购物袋提示 */
  const toast = document.createElement("div");
  toast.id = "gj-cart-toast";
  toast.setAttribute("role", "status");
  toast.setAttribute("aria-live", "polite");
  document.body.appendChild(toast);

  let toastTimer;

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);

    toastTimer = setTimeout(function () {
      toast.classList.remove("show");
    }, 2200);
  }

  /* 顶部导航加入查询订单按钮 */
  function setupHeader() {
    const header = document.querySelector(".header");
    if (!header) return;

    const controls = header.querySelector("div");
    if (!controls) return;

    if (!$("gj-track-order-shortcut")) {
      const button = document.createElement("button");
      button.id = "gj-track-order-shortcut";
      button.type = "button";
      button.className = "btn";

      button.onclick = function () {
        const orderButton = $("gj-my-orders-button");

        if (orderButton) {
          orderButton.click();
        } else {
          showToast(
            text(
              "订单查询功能正在加载，请稍后再试",
              "Order tracking is loading. Please try again."
            )
          );
        }
      };

      const languageButton = $("languageToggle");
      controls.insertBefore(button, languageButton);
    }

    updateLabels();
  }

  /* 更新中英文提示 */
  function updateLabels() {
    const zh = currentLang() === "zh";

    const search = $("search");
    if (search) {
      search.placeholder = zh
        ? "搜索你心仪的商品"
        : "Search for your favourite products";
    }

    document.querySelectorAll("select.model").forEach(function (select) {
      const first = select.options[0];
      if (first) {
        first.textContent = zh
          ? "选择款式 / 型号"
          : "Select style / model";
      }
    });

    const track = $("gj-track-order-shortcut");
    if (track) {
      track.textContent = zh ? "查询订单" : "Track Order";
    }

    const cartButton = $("cartOpen");
    if (cartButton) {
      const count = $("count");
      const number = count ? count.textContent : "0";

      cartButton.textContent =
        (zh ? "购物袋" : "Bag") + " (" + number + ")";
    }
  }

  /*
   * 购物袋显示商品图片、名称、型号、数量及价格。
   * 保留原有数量调整、删除、优惠和运费计算。
   */
  function improveCart() {
    if (typeof window.renderCart !== "function") return;

    const originalRenderCart = window.renderCart;

    window.renderCart = function () {
      originalRenderCart();

      const cartItems = $("cartItems");
      if (!cartItems) return;

      /*
       * 从原本的 cart 与 products 数据取得图片，
       * 不改变原本购物车的数据结构。
       */
      if (!Array.isArray(window.cart) ||
          !Array.isArray(window.products)) {
        updateLabels();
        return;
      }

      const lines = cartItems.querySelectorAll(".cart-line");

      lines.forEach(function (line, index) {
        const item = window.cart[index];
        if (!item) return;

        const product = window.products.find(function (p) {
          return String(p.id) === String(item.id);
        });

        if (!product) return;

        if (line.querySelector(".gj-cart-thumb")) return;

        const image = document.createElement("img");
        image.className = "gj-cart-thumb";
        image.alt = product.name || "Product";

        if (product.image) {
          image.src = product.image;
        } else {
          image.style.display = "none";
        }

        const children = Array.from(line.children);
        const details = children[0];
        const price = children[1];

        if (details) {
          details.classList.add("gj-cart-details");
          line.insertBefore(image, details);
        }

        if (price) {
          price.classList.add("gj-cart-price");
        }
      });

      updateLabels();
    };
  }

  /*
   * 成功加入购物袋时显示提示。
   * 仅在购物袋数量确实增加时提示成功。
   */
  function improveAddToCart() {
    if (typeof window.addToCart !== "function") return;

    const originalAddToCart = window.addToCart;

    window.addToCart = function (id) {
      const before = Array.isArray(window.cart)
        ? window.cart.reduce((sum, item) => sum + Number(item.qty || 0), 0)
        : 0;

      originalAddToCart(id);

      const after = Array.isArray(window.cart)
        ? window.cart.reduce((sum, item) => sum + Number(item.qty || 0), 0)
        : before;

      if (after > before) {
        showToast(
          text("已成功加入购物袋 ✓", "Added to bag ✓")
        );

        updateLabels();
      }
    };
  }

  /* 购物袋打开后，导航始终保留 */
  function keepHeaderVisible() {
    const header = document.querySelector(".header");
    if (header) {
      header.style.position = "sticky";
      header.style.top = "0";
      header.style.zIndex = "1000";
    }
  }

  /*
   * 监听原页面重新绘制商品或切换语言，
   * 重新应用文字与导航设置。
   */
  function startObserver() {
    const products = $("products");
    const languageButton = $("languageToggle");

    if (products) {
      const observer = new MutationObserver(function () {
        updateLabels();
      });

      observer.observe(products, {
        childList: true,
        subtree: true
      });
    }

    if (languageButton) {
      languageButton.addEventListener("click", function () {
        setTimeout(updateLabels, 50);
        setTimeout(updateLabels, 250);
      });
    }

    const cartButton = $("cartOpen");
    if (cartButton) {
      cartButton.addEventListener("click", function () {
        setTimeout(updateLabels, 50);
      });
    }
  }

  /*
   * 等原本页面的购物车函数可用后再增强。
   */
  let attempts = 0;

  function initialize() {
    attempts++;

    setupHeader();
    keepHeaderVisible();

    if (typeof window.renderCart === "function" &&
        typeof window.addToCart === "function") {
      improveCart();
      improveAddToCart();

      if (typeof window.renderCart === "function") {
        window.renderCart();
      }

      updateLabels();
      startObserver();
      return;
    }

    if (attempts < 40) {
      setTimeout(initialize, 100);
    }
  }

  initialize();

})();
<\/script>`;

        html = html.replace("</body>", extraScripts + "</body>");

        document.open();
        document.write(html);
        document.close();

      } catch (error) {
        console.error("Graceantjoy loading error:", error);

        loading.textContent =
          "商店加载失败，请刷新页面或稍后再试。";
      }
    })();
  </script>
</body>
</html>
